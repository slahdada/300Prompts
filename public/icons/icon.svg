<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer diamond ring -->
  <rect x="156" y="156" width="200" height="200" rx="36" transform="rotate(45 256 256)" fill="none" stroke="url(#sparkleGrad)" stroke-width="8" opacity="0.4" />

  <!-- Slash Command Symbol '/' and Prompt '>' -->
  <g transform="translate(110, 140)">
    <!-- Prompt angle bracket '>' -->
    <path d="M 40 50 L 130 116 L 40 182" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Slash symbol '/' -->
    <line x1="160" y1="210" x2="220" y2="25" stroke="url(#sparkleGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Underline cursor '_' -->
    <line x1="140" y1="200" x2="240" y2="200" stroke="#f43f5e" stroke-width="22" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- AI Sparkle stars -->
  <path d="M 390 100 Q 390 130 420 130 Q 390 130 390 160 Q 390 130 360 130 Q 390 130 390 100 Z" fill="#38bdf8" filter="url(#glow)" />
  <path d="M 120 370 Q 120 390 140 390 Q 120 390 120 410 Q 120 390 100 390 Q 120 390 120 370 Z" fill="#ec4899" opacity="0.85" />
</svg>
